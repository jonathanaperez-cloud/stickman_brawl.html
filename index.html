<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Brawl - Arena de Combate 2D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090b10;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        .arcade-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            aspect-ratio: 16 / 9;
            max-height: 92vh;
            background: #0f172a;
            border: 3px solid #334155;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(56, 189, 248, 0.15);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Barras de vida con retraso de daño */
        .health-bar-bg {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #475569;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            height: 22px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.7);
        }
        .health-delay {
            position: absolute;
            top: 0;
            bottom: 0;
            background: #facc15;
            transition: width 0.25s ease-out;
        }
        .health-fill {
            position: absolute;
            top: 0;
            bottom: 0;
            transition: width 0.08s linear;
        }
        .energy-bar-bg {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #475569;
            border-radius: 6px;
            overflow: hidden;
            height: 10px;
            margin-top: 4px;
        }
        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fde047);
            transition: width 0.15s ease-out;
        }
        .energy-ready {
            box-shadow: 0 0 12px #fde047;
            animation: pulseEnergy 0.6s infinite alternate;
        }
        @keyframes pulseEnergy {
            from { filter: brightness(1); }
            to { filter: brightness(1.4); }
        }
        .btn-arcade {
            transition: all 0.15s ease;
            border-bottom: 4px solid rgba(0,0,0,0.4);
        }
        .btn-arcade:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-arcade:active {
            transform: translateY(2px);
            border-bottom-width: 1px;
        }
        /* Controles táctiles en pantalla */
        .touch-btn {
            background: rgba(30, 41, 59, 0.72);
            border: 2px solid rgba(148, 163, 184, 0.45);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            touch-action: manipulation;
        }
